<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Filtros de sombra y profundidad 3D -->
    <filter id="appIconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#020617" flood-opacity="0.6"/>
    </filter>
    <filter id="elementShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Degradados del fondo del ícono -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="45%" stop-color="#0f284e"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#1d4ed8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0f284e" stop-opacity="0"/>
    </radialGradient>

    <!-- Borde interior brillante tipo cristal -->
    <linearGradient id="innerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.20"/>
    </linearGradient>

    <!-- Banderas y Tricolor de Venezuela con brillos -->
    <linearGradient id="venYellow" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>

    <linearGradient id="venBlue" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="50%" stop-color="#00247d"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>

    <linearGradient id="venRed" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Metales y Carrito de Compras -->
    <linearGradient id="cartGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="cartGridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fde68a" stop-opacity="0.55"/>
    </linearGradient>

    <!-- Monedas 3D: Dólar ($) y Bolívar (Bs.) -->
    <linearGradient id="coinUsdRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="coinUsdFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <linearGradient id="coinBsRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="coinBsFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="coinHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Estrella de 5 puntas para el arco de 8 estrellas -->
    <g id="star-ven">
      <polygon points="0,-6 1.8,-1.9 6.2,-1.9 2.7,0.8 4,5.2 0,2.5 -4,5.2 -2.7,0.8 -6.2,-1.9 -1.8,-1.9" fill="#ffffff"/>
    </g>
    <clipPath id="squircleClip">
      <rect width="512" height="512" rx="116"/>
    </clipPath>
  </defs>

  <!-- ================= BASE DEL ICONO (SQUIRCLE) ================= -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="116" fill="url(#centerGlow)"/>
  <rect x="5" y="5" width="502" height="502" rx="112" fill="none" stroke="url(#innerBorder)" stroke-width="3"/>

  <!-- ================= ONDA TRICOLOR DE VENEZUELA CON 8 ESTRELLAS DENTRO DEL AZUL ================= -->
  <g clip-path="url(#squircleClip)" filter="url(#elementShadow)">
    <!-- Franja Amarilla (Superior) -->
    <path d="M 230 0 L 512 0 L 512 85 C 415 52, 320 20, 230 0 Z" fill="url(#venYellow)"/>

    <!-- Franja Azul (Media - Con las 8 Estrellas Centradas) -->
    <path d="M 230 0 C 320 20, 415 52, 512 85 L 512 150 C 415 117, 280 65, 160 0 L 230 0 Z" fill="url(#venBlue)"/>

    <!-- 8 Estrellas Blancas en Arco 100% Centradas Dentro de la Franja Azul -->
    <use href="#star-ven" x="255" y="29" transform="rotate(16, 255, 29)"/>
    <use href="#star-ven" x="290" y="39" transform="rotate(18, 290, 39)"/>
    <use href="#star-ven" x="325" y="50" transform="rotate(20, 325, 50)"/>
    <use href="#star-ven" x="360" y="62" transform="rotate(22, 360, 62)"/>
    <use href="#star-ven" x="395" y="75" transform="rotate(23, 395, 75)"/>
    <use href="#star-ven" x="430" y="88" transform="rotate(24, 430, 88)"/>
    <use href="#star-ven" x="465" y="102" transform="rotate(25, 465, 102)"/>
    <use href="#star-ven" x="495" y="113" transform="rotate(25, 495, 113)"/>

    <!-- Franja Roja (Inferior) -->
    <path d="M 160 0 C 280 65, 415 117, 512 150 L 512 210 C 380 177, 230 110, 90 0 L 160 0 Z" fill="url(#venRed)"/>
  </g>

  <!-- ================= MONEDAS FLOTANTES DE CONVERSIÓN ================= -->
  <!-- 1. Moneda Secundaria: Bs. (Bolívares en Oro Ámbar) -->
  <g filter="url(#elementShadow)">
    <circle cx="195" cy="205" r="54" fill="url(#coinBsRim)"/>
    <circle cx="195" cy="205" r="46" fill="url(#coinBsFace)"/>
    <!-- Brillo superior -->
    <path d="M 152 195 A 46 46 0 0 1 238 195 C 230 178, 160 178, 152 195 Z" fill="url(#coinHighlight)"/>
    <!-- Texto Bs. -->
    <text x="195" y="217" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">Bs.</text>
  </g>

  <!-- 2. Moneda Principal: USD ($ en Verde Esmeralda Premium) -->
  <g filter="url(#elementShadow)">
    <circle cx="300" cy="180" r="66" fill="url(#coinUsdRim)"/>
    <circle cx="300" cy="180" r="56" fill="url(#coinUsdFace)"/>
    <!-- Brillo superior -->
    <path d="M 248 168 A 56 56 0 0 1 352 168 C 342 148, 258 148, 248 168 Z" fill="url(#coinHighlight)"/>
    <!-- Símbolo $ -->
    <text x="300" y="201" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>
  </g>

  <!-- Pequeños destellos de brillo (Sparkles) -->
  <g fill="#ffffff" filter="url(#glowGold)">
    <path d="M 370 120 Q 370 135 385 135 Q 370 135 370 150 Q 370 135 355 135 Q 370 135 370 120 Z"/>
    <path d="M 135 155 Q 135 165 145 165 Q 135 165 135 175 Q 135 165 125 165 Q 135 165 135 155 Z" transform="scale(0.8) translate(30, 20)"/>
  </g>

  <!-- ================= CARRITO DE COMPRAS HERO ================= -->
  <g filter="url(#elementShadow)">
    <!-- Rejilla interna del carrito -->
    <path d="M 175 258 L 388 258" stroke="url(#cartGridGrad)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 190 298 L 372 298" stroke="url(#cartGridGrad)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 235 235 L 218 332" stroke="url(#cartGridGrad)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 292 235 L 280 332" stroke="url(#cartGridGrad)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 348 235 L 340 332" stroke="url(#cartGridGrad)" stroke-width="7" stroke-linecap="round"/>

    <!-- Estructura principal del carrito (Cuerpo, Cesta y Manillar) -->
    <path d="M 102 208 L 148 208 L 198 344 L 378 344 L 414 235 L 170 235" 
          fill="none" 
          stroke="url(#cartGold)" 
          stroke-width="19" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Chasis inferior conector de ruedas -->
    <path d="M 200 376 L 360 376" stroke="#94a3b8" stroke-width="9" stroke-linecap="round"/>
    <path d="M 215 344 L 215 376 M 345 344 L 345 376" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>

    <!-- Ruedas Delantera y Trasera con relieve 3D -->
    <!-- Rueda Trasera -->
    <g transform="translate(215, 400)">
      <circle cx="0" cy="0" r="28" fill="#1e293b"/>
      <circle cx="0" cy="0" r="23" fill="url(#cartGold)"/>
      <circle cx="0" cy="0" r="14" fill="#0f172a"/>
      <circle cx="0" cy="0" r="6" fill="#f8fafc"/>
    </g>

    <!-- Rueda Delantera -->
    <g transform="translate(345, 400)">
      <circle cx="0" cy="0" r="28" fill="#1e293b"/>
      <circle cx="0" cy="0" r="23" fill="url(#cartGold)"/>
      <circle cx="0" cy="0" r="14" fill="#0f172a"/>
      <circle cx="0" cy="0" r="6" fill="#f8fafc"/>
    </g>
  </g>
</svg>
